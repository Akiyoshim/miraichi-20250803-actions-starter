name: verify
on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      # 注意: npm run verify 内の --dry-run はRSSを実際に取得するため、
      # このステップはネットワークにアクセスする（npm test 部分はネットワーク非依存）
      - name: ゴールコマンド(npm run verify)を実行
        run: npm run verify
